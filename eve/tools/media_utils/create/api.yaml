name: Create
description: Generate or edit images and videos from an objective, single-scene prompt plus optional reference media.
tip: |-
  Images:
    - For multi-image consistency sets there are two approaches: model_preference=seedream with n_samples>1 produces up to 15 images in ONE call with model-side consistency; the default (or model_preference=nano_banana) produces one image per call and you carry consistency yourself by feeding each approved output back in as a reference image. Prefer seedream for N images at once, the consecutive approach when each frame must be approved before the next.
    - For text-heavy designs (infographics, logos, signage), prefer model_preference=nano_banana at standard quality; when premium models are enabled, quality="pro" (gpt_image_2) renders long or exact text most reliably.
    - ONLY use model_preference=openai when the user explicitly requests OpenAI/DALL-E/GPT image generation. Prefer nano_banana otherwise.

  Real people / content policy:
    - If a model rejects an input as a real-person likeness, create AUTOMATICALLY re-renders on a more permissive model at the SAME price and notes it in subtool_calls: pro-tier image EDITS fall back to nano_banana_pro; image-to-video falls back to kling, then wan with its safety checker off.
    - There is NO automatic fallback for text-to-video or for the reference_video route. For reference-driven video of real people use the standalone vidu_reference tool.

  Videos:
    - If reference_images or reference_video are provided, describe only motion/camera/dynamics in the prompt and refer to the specific references; do not re-prompt existing content already provided by references.
    - Use sound_effects if you need synthesized dialogue/foley/music. Do not mix a separate audio file unless using extras.talking_head.

  Aspect ratio:
    - Use 16:9 (landscape), 1:1 (square), 9:16 (portrait) unless the user specifies otherwise.
    - If aspect_ratio != "auto", it overrides any aspect ratio inferred from references.
# pro image tier covers gpt_image_2 high ($0.211/img) at ~+42%; standard covers nb2
cost_estimate: '(output == "video" ? (((quality == "pro" ? 50 : 25) + (sound_effects ? 10 : 0)) * duration) : ((quality == "pro" ? 30 : 10) * n_samples))'
output_type: image
active: true
visible: true
handler: modal
parameters:
  output:
    type: string
    label: Output type
    description: Whether to generate an image or video
    default: "image"
    choices: ["image", "video"]
    required: true
  prompt:
    type: string
    label: Prompt
    description: One objective, single-scene instruction for what to generate or edit. No roleplay.
    tip: |-
      Write a concise, structured brief the model can execute deterministically.

      From-scratch (image or video):
        • Purpose (asset/use) → Subject + Action → Environment/Context → Style/Lighting/Camera → Composition/Framing.
        • Use full sentences, not keyword lists. Put any literal text to render in "double quotes".
        • Do not mention tool parameters in the prompt (aspect ratio, model, etc. go in their fields).
        • Do not refer to previous images or creations, each toolcall runs in isolation and so the prompt must stand on its own.

      Edits (image or video):
        • Use: Action + Target + Location + Keep/Constraints.
        • Refer to references by index/role: “Image 1 …”, “Image 2 …”. (Image 1 = reference_images[0])
        • Be explicit about what stays unchanged (e.g., “keep pose and background”).
        • Be surgical: specify exactly what to change and what must remain unchanged.
        • Avoid pronouns; reference the object directly (“the woman’s jacket”, not “her jacket”).

      Reference usage:
        • Do not re-describe the visual content of references; the model sees the pixels. State each reference’s **role and constraints** only (e.g., “Image 1 = style guide (palette + linework); do not copy text/icons”).
        • Combine by role: “Use the composition from Image 1, the character/identity from Image 2, and the ink style from Image 3.”
        • For identity/style transfer, specify what to extract (“maintain character identity from Image 2”) and where to apply it.
        • If multiple references are provided, name each and state its function to avoid ambiguity.

      Video-specific:
        • If init/end images or a reference video are provided, describe only motion/camera/dynamics, timing, and transitions.
        • Include camera moves (“slow dolly-in”, “handheld sway”), pacing (“2‑second hold”, “quick cut”), and action beats.
        • Dialogue/foley/music belong in the PROMPT for the default video models (they have native audio); sound_effects only switches that audio on — see its tip.

      Phrasing:
        • Prefer positive constraints (“empty street”) over negatives (“no cars”).
        • Use precise placements (“logo on left chest”, “3/4 view ~30°”, “shoulder‑up crop”).
      
      Mini-examples:
        • From-scratch: “Poster: A red sports coupe drifting on a wet city street at night, neon reflections, photoreal 50mm, low angle, golden rim light, dramatic rain streaks, centered composition.”
        • Edit w/ refs: “Image 1: replace the background with a sunset cityscape in watercolor style from Image 3; keep the subject from Image 1 and maintain her outfit; add title text at top reading 'Summer Festival'.”
    required: true
  aspect_ratio:
    type: string
    label: Aspect ratio
    description: Output aspect ratio (width:height).
    tip: |-
      16:9, 9:16, 1:1 and "auto" are safe on every route. Other ratios are model-specific: create will drop one the chosen model doesn't accept and fall back to that model's own default, so framing may not match what you asked for. Prefer one of the four unless the user insists.
      With "auto" the ratio is inferred from the FIRST reference image where the model supports it, otherwise the model's default applies (16:9 for video).
    default: "auto"
    choices: ["auto", "21:9", "16:9", "3:2", "4:3", "5:4", "1:1", "4:5", "3:4", "2:3", "9:16", "9:21"]
  reference_images:
    type: array
    items:
      type: image
    max_length: 14
    label: Reference images
    description: Reference images for generation or editing.
    tip: |-
      Use for editing, identity/style transfer, composition borrowing, or other image-to-image tasks.
      - Label references in the prompt as Image 1, Image 2, … (Image 1 = reference_images[0]).
      - When multiple references are used, state each image’s role (e.g., Image 1: base subject; Image 2: outfit; Image 3: art style). **Avoid prose descriptions of the images; list roles/constraints (what to copy and what to ignore).**
      - For video interpolation: reference_images[0] = init frame, reference_images[1] = end frame.
      - If aspect_ratio is set to auto, it will follow the last reference image’s aspect ratio; set aspect_ratio explicitly to control it.
  n_samples:
    type: integer
    label: Number of samples
    description: Images only. How many variations, individual images, or samples to generate
    tip: |-
      Images only. Values above 4 are ONLY meaningful with model_preference=seedream (up to 15, generated as a consistent set — same identity/style across images). Every other model caps at 4 and the value is clamped; model_preference=nano_banana (Nano Banana Pro) always returns exactly 1 regardless.
      **IMPORTANT** -- If you get a 403 Forbidden on a reference image, almost definitely you made a transcription error or made up a URL that doesn't exist. Use previous outputs or concept image references instead.
    default: 1
    minimum: 1
    maximum: 15
    required: false
  reference_video:
    type: video
    label: Reference video
    description: Reference video for style transfer (video output only).
    tip: |-
      Videos only. PREMIUM ONLY: a reference_video routes to Seedance 2 Reference regardless of model_preference. Without premium models enabled (owner opt-in + entitled payer) the call FAILS — do not offer this to non-premium users.
      Any reference_images are forwarded too (first 9). Cite assets in the prompt as @Video1 and @Image1, @Image2, … (NOT "Image 1").
      CONTENT POLICY: ByteDance rejects references resembling REAL PEOPLE (photorealistic AI humans included), and there is NO automatic fallback on this route. For real people use the standalone vidu_reference tool (reference images only, fixed ~4s clip).
  seed:
    type: integer
    label: Seed
    description: Random seed for reproducible generation
    tip: Honored only on some routes (nano_banana_2, seedream, flux/sdxl, wan, seedance1, runway). IGNORED by the default video models (kling_v3, veo_31_lite), by Seedance 2 (no seed input at all), and by the pro image tier (gpt_image_2, nano_banana_pro). Do not promise the user a reproducible re-render on those routes.
    required: false
  extras:
    type: array
    label: Extra features
    description: Optional extra features to enable
    # NOTE: "double_character" is currently a no-op (nothing reads it) but is kept
    # in the enum so previously-stored args don't fail validation. The handler
    # also reads a "controlnet" extra that is deliberately NOT exposed here yet —
    # that path is untested; enable it separately, not as a docs change.
    items:
      type: string
      enum: ["talking_head", "double_character"]
    tip: |-
      - talking_head (videos only): For lip-sync or talking avatars (Hedra). Requires a face in references or prompt AND a speech-only audio file in the audio parameter — without audio the flag is silently ignored and an ordinary video is produced.
    default: []
  duration:
    type: integer
    label: Duration
    description: Approximate duration of the video in seconds
    tip: Videos only, and APPROXIMATE — the chosen model snaps it. Veo 3.1 Lite (the text-to-video default) supports only 4/6/8s, so 5 becomes 4s; Runway and Seedance 1 snap to 5 or 10. For 11-15s clips call seedance2 or wan_27 directly.
    default: 10
    minimum: 5
    maximum: 10
  lora:
    type: lora
    label: LoRA model
    description: ID of LoRA model finetuned to specific style, face, or object.
  lora_strength:
    type: float
    label: LoRA strength
    description: Strength of the LoRA model
    tip: |-
      Higher values increase resemblance to the LoRA subject; lower values increase prompt adherence. 
      Typical ranges: 0.25–0.7 (balanced), 0.8–1.0 (strong likeness). If likeness is weak, increase. If likeness is too strong and ignores prompt, decrease.
    default: 0.8
    minimum: 0
    maximum: 1.2
  lora2:
    type: lora
    label: Second LoRA model
    description: ID of second LoRA finetuned model.
  lora2_strength:
    type: float
    label: Second LoRA strength
    description: Strength of the second LoRA
    tip: |-
      Same as lora_strength but for lora2.
    default: 0.8
    minimum: 0
    maximum: 1.2
  quality:
    type: string
    label: Quality
    description: Quality vs speed tradeoff
    tip: |-
      "standard": cost-effective models — nano_banana_2 for images; kling_v3
      (img2vid) / veo_31_lite (txt2vid) for video.
      "pro": SIGNIFICANTLY more expensive. Images -> gpt_image_2 when premium
      models are enabled (owner opt-in + entitled payer), else nano_banana_pro
      for subscribers, else nano_banana_2. Video: image-to-video -> seedance2
      ONLY when premium is enabled; without premium it stays on kling_v3 and pro
      buys nothing but a 2x bill. Text-to-video -> veo3 for subscribers, else
      veo_31_lite; seedance2 is NEVER chosen for text-to-video — pass
      model_preference="seedance" if you want it.
      Default to standard. Only pass "pro" when the user explicitly asks for
      high/best quality — and mention that it costs more. (If the agent owner
      has set default_quality="pro" in this agent's settings, the default is
      reversed and this tip is overridden.)
    default: "standard"
    choices: ["standard", "pro"]
  model_preference:
    type: string
    label: Model preference
    description: Optional preference for specific model provider
    tip: |-
      If omitted, auto-selects: the request arg wins, then the agent's stored
      preference, then the paying user's preference, then the default.
      Videos: kling (Kling 3 — the image-to-video default; on TEXT-to-video there
      is no Kling endpoint and this routes to Wan 2.7), wan (Wan 2.7 — best
      value; 1080p only at quality="pro", otherwise 720p), seedance (Seedance 2
      when quality="pro" AND premium models are enabled, else Seedance 1),
      veo (Veo-3 for any subscriber at any quality — it runs in Fast mode at
      quality="standard"; Veo 3.1 Lite for non-subscribers), runway (legacy).
      Images: nano_banana (Nano Banana PRO — subscriber-only, returns exactly 1
      image, downgrades to Nano Banana 2 otherwise; leave model_preference UNSET
      to get the Nano Banana 2 default), seedream (Seedream 4.5 — the only route
      supporting n_samples > 4), openai (GPT Image 2 when premium is enabled;
      without premium it falls back to GPT Image 1.5 Edit, which REQUIRES a
      reference image), flux (FLUX.1-dev + LoRAs, text-to-image only — IGNORED
      when reference_images are supplied), sdxl (legacy, for SDXL loras).
    choices: ["kling", "wan", "seedream", "seedance", "sdxl", "runway", "openai", "flux", "veo", "nano_banana"]
  audio:
    type: audio
    label: Audio track
    description: Speech audio file (videos + extras.talking_head only).
    tip: |-
      Speech/voice audio. With extras=["talking_head"] it drives Hedra lip-sync (the flag is IGNORED if you set it without audio — an ordinary video is produced with no error).
      It is ALSO used as a voice reference on the wan route (3-5s of clean speech clones timbre and pacing) and as an audio reference on the reference_video route. Ignored elsewhere.
      For generic background music or SFX mixing, use the media_editor tool instead.
    required: false
  sound_effects:
    type: string
    label: Sound effects / dialogue
    description: Optional synthesized dialogue, foley, or music to generate over the video.
    tip: |-
      Videos only. On the DEFAULT routes this is essentially an audio ON/OFF switch, not a script: kling_v3 (image-to-video), veo_31_lite (text-to-video), wan_27 and seedance2 all generate their own native audio and DO NOT receive this text — put the dialogue/foley/music description inside `prompt` for those.
      Only the veo3 route appends this text to the prompt. Legacy models without native audio (runway, seedance1) get a separately synthesized track from this text.
      Ignored when an audio file is supplied with extras.talking_head.
    required: false
