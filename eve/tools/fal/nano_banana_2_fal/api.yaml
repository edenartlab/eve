name: Nano Banana 2 (FAL)
description: Google's next-gen image generation and editing model via FAL.ai with resolution control and web search. Supports text-to-image and image editing.
tip: |-
  Eden's standard-tier default for images and image editing — near-frontier
  quality at the cheapest price point. Provide image_urls to switch into editing
  mode (multiple reference images supported, up to 14).

  - num_images caps at 4. For larger consistent sets use seedream.
  - resolution drives cost: 4K is 2x the 1K price, 0.5K is ~22% cheaper than 1K.
    The default is 1K — iterate there.
  - aspect_ratio DEFAULTS TO 1:1. Pass "auto" to follow the input image; when
    editing a wide reference, leaving the default gives you a square crop.
  - enable_web_search adds ~2 manna per image; use it only for current events or
    real-world references.
  - Real faces: on the editing path this tool runs at the most permissive
    moderation setting, which makes it Eden's route for editing photos of real
    people.
output_type: image
cost_estimate: '((resolution == "4K" ? 18 : resolution == "2K" ? 14 : resolution == "0.5K" ? 7 : 9) + (enable_web_search ? 2 : 0)) * num_images'
handler: modal
thumbnail: app/nano_banana_pro.jpg
visible: true
active: true
parameters:
  prompt:
    type: string
    label: Prompt
    required: true
  image_urls:
    type: array
    items:
      type: image
    label: Input Images (for editing)
    description: Optional input images for editing mode
    max_length: 14
  num_images:
    type: integer
    default: 1
    minimum: 1
    maximum: 4
  resolution:
    type: string
    label: Resolution
    description: Output resolution (4K costs 2x)
    default: '1K'
    choices: ['0.5K', '1K', '2K', '4K']
  enable_web_search:
    type: boolean
    label: Enable Web Search
    description: Enable web search for current events or real-world references
    default: false
  aspect_ratio:
    type: string
    default: '1:1'
    choices: ['auto', '21:9', '16:9', '3:2', '4:3', '5:4', '1:1', '4:5', '3:4', '2:3', '9:16']
  output_format:
    type: string
    default: png
    choices: ['jpeg', 'png', 'webp']
    hide_from_user: true
    hide_from_agent: true
  seed:
    type: integer
    minimum: 0
    maximum: 2147483647
    default: random
